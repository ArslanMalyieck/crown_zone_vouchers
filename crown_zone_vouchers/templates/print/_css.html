{% set navy = "#0A2540" %}

<style>
.cz{font-family:"Segoe UI",Arial,Helvetica,sans-serif;font-size:8.2pt;color:{{ ink }};line-height:1.4}

/* ---- PDF layout / pagination ---- */
.cz table{page-break-inside:auto}
.cz tr{page-break-inside:avoid}
.cz thead{display:table-header-group}

.cz-hdr,.cz-titlebar,.cz-bill,.cz-info,.cz-kv,.cz-sign,.cz-invt,.cz-terms,.cz-inq,.cz-note,.cz-wave,.cz-foot{page-break-inside:avoid}
.cz td,.cz th,.cz-tbl td,.cz-kv td,.cz-sign td,.cz-invt td{word-wrap:break-word}

.czp{width:100%;height:246mm;border-collapse:collapse}
.czp>tbody>tr>td{padding:0 !important;vertical-align:top}
.czp-main{height:100%}
