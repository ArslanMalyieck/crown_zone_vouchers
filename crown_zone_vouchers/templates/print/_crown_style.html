{% set navy = "#0B1F4B" %}{% set deep = "#07163A" %}{% set gold = "#C9A227" %}{% set lgold = "#E8D48A" %}{% set soft = "#FBF6E4" %}{% set lnavy = "#EEF1F8" %}{% set ink = "#1A1A1A" %}{% set muted = "#6B7280" %}{% set line = "#D9DCE3" %}
<style>
.czg{font-family:Arial,Helvetica,sans-serif;font-size:11px;color:{{ ink }};line-height:1.4;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.czg table{width:100%;border-collapse:collapse}
.czg td,.czg th{vertical-align:top}
.czg .nw{white-space:nowrap}
.czg .hdr{background:{{ navy }};border-bottom:3px solid {{ gold }};padding:9px 10px}
.czg .hdr td{border:0;padding:0}
.czg .logo{width:86px}
.czg .logo img{max-height:70px;max-width:80px;background:#fff;padding:3px;border-radius:4px;display:block}
.czg .co{font-size:16px;font-weight:bold;color:{{ gold }};letter-spacing:.4px;line-height:1.2}
.czg .co-sub{font-size:9px;color:{{ lgold }};letter-spacing:1.4px;margin-top:1px}
.czg .co-meta{font-size:10px;color:#fff;margin-top:3px;line-height:1.45}
.czg .badge{display:inline-block;background:{{ gold }};color:{{ navy }};font-weight:bold;font-size:12px;letter-spacing:1px;padding:7px 12px;text-align:center}
.czg .badge small{display:block;font-size:8px;letter-spacing:.8px;font-weight:bold;margin-top:2px;color:{{ deep }}}
.czg .cards{margin-top:8px}
.czg .cards td{width:50%;border:1px solid {{ line }};border-left:3px solid {{ gold }};background:{{ lnavy }};padding:7px 9px}
.czg .cards td.gap{width:8px;border:0;background:#fff;padding:0}
.czg .kicker{font-size:8px;font-weight:bold;letter-spacing:1.2px;color:{{ navy }};text-transform:uppercase;margin-bottom:2px}
.czg .party{font-size:13px;font-weight:bold;color:{{ navy }};margin-bottom:2px}
.czg .small{font-size:10px;color:{{ muted }};line-height:1.45}
.czg .meta{margin-top:8px;border:1px solid {{ line }}}
.czg .meta td{border-bottom:1px solid {{ gold }};padding:4px 8px;font-size:10px}
.czg .meta td.l{background:{{ lnavy }};color:{{ navy }};font-weight:bold;width:14%;white-space:nowrap}
.czg .meta td.v{width:36%}
.czg .sec{background:{{ navy }};color:#fff;font-size:10px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;padding:5px 8px;border-bottom:2px solid {{ gold }};margin-top:9px}
.czg .tbl{margin-top:0}
.czg .tbl th{background:{{ navy }};color:#fff;font-size:9px;font-weight:bold;letter-spacing:.4px;text-transform:uppercase;padding:5px 6px;border-bottom:2px solid {{ gold }};text-align:left}
.czg .tbl td{border-bottom:1px solid {{ line }};padding:4px 6px;font-size:10px}
.czg .tbl tbody tr:nth-child(even) td{background:{{ soft }}}
.czg .tbl tr{page-break-inside:avoid}
.czg .tbl thead{display:table-header-group}
.czg .r{text-align:right}
.czg .c{text-align:center}
.czg .tot{margin-top:8px;page-break-inside:avoid}
.czg .tot table{width:52%;margin-left:48%}
.czg .tot td{border-bottom:1px solid {{ line }};padding:4px 8px;font-size:10px}
.czg .tot td.k{text-align:right;color:{{ muted }};width:60%}
.czg .tot td.n{text-align:right;font-weight:bold;color:{{ ink }};width:40%}
.czg .tot tr.grand td{background:{{ navy }};color:{{ gold }};font-size:12px;font-weight:bold;border-top:2px solid {{ gold }};padding:6px 8px}
.czg .tot tr.grand td.k{color:{{ lgold }}}
.czg .words{margin-top:7px;background:{{ soft }};border-left:3px solid {{ gold }};padding:5px 8px;font-size:10px;color:{{ navy }};font-style:italic;page-break-inside:avoid}
.czg .note{margin-top:7px;font-size:10px;color:{{ muted }};page-break-inside:avoid}
.czg .terms{margin-top:8px;font-size:9px;color:{{ muted }};line-height:1.45;page-break-inside:avoid}
.czg .terms b{color:{{ navy }}}
.czg .sign{margin-top:14px;page-break-inside:avoid}
.czg .sign td{width:33.33%;border-top:2px solid {{ gold }};padding:5px 8px 0;font-size:9px;color:{{ muted }}}
.czg .sign td b{display:block;color:{{ navy }};font-size:10px;margin-bottom:2px}
.czg .foot{margin-top:12px;background:{{ navy }};border-top:3px solid {{ gold }};color:#fff;page-break-inside:avoid}
.czg .foot td{padding:6px 8px;font-size:9px;color:#fff;width:33.33%}
.czg .foot td.c{text-align:center}
.czg .foot td.r{text-align:right}
.czg .foot span.k{color:{{ gold }};font-weight:bold;margin-right:3px}
.czg .bank{margin-top:7px;border:1px solid {{ line }};background:{{ lnavy }};padding:5px 8px;font-size:9px;color:{{ ink }};page-break-inside:avoid}
.czg .bank b{color:{{ navy }}}
.czg .chips{margin-top:6px;font-size:9px;color:{{ muted }}}
.czg .chips b{color:{{ navy }}}
</style>
